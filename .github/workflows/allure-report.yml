name: Allure Report

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.framework }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework:
          - playwright
          - mocha
          - cucumber
          - webdriverio
          - vitest
          - jest
          - jasmine
          - cypress
          - codeceptjs
          - newman
          - bun

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        if: matrix.framework == 'bun'
        with:
          bun-version: latest

      - name: Resolve host slug
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "OS_SLUG=linux" >> "$GITHUB_ENV" ;;
            macOS) echo "OS_SLUG=macos" >> "$GITHUB_ENV" ;;
            Windows) echo "OS_SLUG=windows" >> "$GITHUB_ENV" ;;
            *) echo "OS_SLUG=unknown" >> "$GITHUB_ENV" ;;
          esac

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @allure-tests/shared build

      - name: Install Playwright browsers
        if: matrix.framework == 'playwright' || matrix.framework == 'codeceptjs'
        shell: bash
        run: |
          install_playwright() {
            local filter="$1"
            if [ "${{ runner.os }}" = "Linux" ]; then
              pnpm --filter "$filter" exec playwright install --with-deps chromium
            else
              pnpm --filter "$filter" exec playwright install chromium
            fi
          }

          install_playwright @allure-tests/playwright
          if [ "${{ matrix.framework }}" = "codeceptjs" ]; then
            install_playwright @allure-tests/codeceptjs
          fi

      - name: Install Cypress binary
        if: matrix.framework == 'cypress'
        run: pnpm --filter @allure-tests/cypress exec cypress install

      - name: Run tests with Allure run
        timeout-minutes: 20
        shell: bash
        env:
          ALLURE_STAGE: matrix
          ALLURE_RESULTS_DIR: allure-results-${{ matrix.framework }}-${{ env.OS_SLUG }}
          CI: true
        run: |
          mkdir -p allure-dumps
          pnpm exec allure run \
            --config=./allurerc.mjs \
            --environment=${{ env.OS_SLUG }} \
            --dump=allure-dumps/${{ matrix.framework }}-${{ env.OS_SLUG }} \
            -- pnpm --filter @allure-tests/${{ matrix.framework }} test

      - name: Verify Allure dump archive
        id: dump
        if: always()
        shell: bash
        run: |
          dump="allure-dumps/${{ matrix.framework }}-${{ env.OS_SLUG }}.zip"
          if [ ! -f "$dump" ]; then
            echo "Missing Allure dump archive: ${dump}"
            exit 1
          fi
          echo "path=${dump}" >> "$GITHUB_OUTPUT"
          ls -la "$dump"

      - name: Upload Allure dump
        if: always() && steps.dump.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: allure-dump-${{ matrix.framework }}-${{ env.OS_SLUG }}
          path: ${{ steps.dump.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  report:
    name: Generate and publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter=allure-3-tests

      - name: Download Allure dumps
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: ./allure-dumps
          pattern: allure-dump-*
          merge-multiple: true

      - name: Verify Allure dump archives
        shell: bash
        run: |
          shopt -s nullglob
          dumps=(allure-dumps/*.zip)
          echo "Dump archives: ${#dumps[@]}"
          ls -la allure-dumps/*.zip || true
          if [ "${#dumps[@]}" -eq 0 ]; then
            echo "No dump archives found — cannot generate a report."
            exit 1
          fi
          if [ "${#dumps[@]}" -lt 30 ]; then
            echo "Warning: only ${#dumps[@]} dump archives (expected up to 33). Generating a partial merged report."
          fi

      - name: Validate Allure config
        run: node -e "import('./allurerc.mjs').then(() => console.log('Allure config OK'))"

      - name: Generate Allure 3 report
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec allure generate --config=./allurerc.mjs --dump="allure-dumps/*.zip" --output=./allure-report

      - name: Allure Report action
        if: always()
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          remote-href: https://todti.github.io/allure-3-tests/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true
