name: Allure Report

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.framework }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework:
          - playwright
          - mocha
          - cucumber
          - webdriverio
          - vitest
          - jest
          - jasmine
          - cypress
          - codeceptjs
          - newman
          - bun
    env:
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        if: matrix.framework == 'bun'
        with:
          bun-version: latest

      - name: Resolve host slug
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "OS_SLUG=linux" >> "$GITHUB_ENV" ;;
            macOS) echo "OS_SLUG=macos" >> "$GITHUB_ENV" ;;
            Windows) echo "OS_SLUG=windows" >> "$GITHUB_ENV" ;;
            *) echo "OS_SLUG=unknown" >> "$GITHUB_ENV" ;;
          esac

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @allure-tests/shared build

      - name: Install Playwright browsers
        if: matrix.framework == 'playwright' || matrix.framework == 'codeceptjs'
        shell: bash
        run: |
          install_playwright() {
            local filter="$1"
            if [ "${{ runner.os }}" = "Linux" ]; then
              pnpm --filter "$filter" exec playwright install --with-deps chromium
            else
              pnpm --filter "$filter" exec playwright install chromium
            fi
          }

          install_playwright @allure-tests/playwright
          if [ "${{ matrix.framework }}" = "codeceptjs" ]; then
            install_playwright @allure-tests/codeceptjs
          fi

      - name: Install Cypress binary
        if: matrix.framework == 'cypress'
        run: pnpm --filter @allure-tests/cypress exec cypress install

      - name: Run tests with Allure run
        timeout-minutes: 20
        shell: bash
        env:
          ALLURE_STAGE: matrix
          CI: true
        run: |
          pnpm allure run \
            --environment=${{ env.OS_SLUG }} \
            -- pnpm --no-bail --filter @allure-tests/${{ matrix.framework }} test || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-${{ matrix.framework }}-${{ env.OS_SLUG }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Generate and publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 30
    env:
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter=allure-3-tests --ignore-scripts

      - name: Download Allure results
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: ./allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Verify Allure results
        shell: bash
        run: |
          count=$(find allure-results -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Result files: ${count}"
          if [ "$count" -eq 0 ]; then
            echo "No result files found — cannot generate a report."
            exit 1
          fi

      - name: Generate Allure 3 report
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm allure generate --output=./allure-report

      - name: Allure Report action
        if: always()
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          remote-href: https://todti.github.io/allure-3-tests/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ${{ github.head_ref || github.ref_name }}
          keep_files: true
