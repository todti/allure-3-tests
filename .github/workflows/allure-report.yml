name: Allure Report

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.framework }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework:
          - playwright
          - mocha
          - cucumber
          - webdriverio
          - vitest
          - jest
          - jasmine
          - cypress
          - codeceptjs
          - newman
          - bun
    env:
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        if: matrix.framework == 'bun'
        with:
          bun-version: latest

      - name: Resolve host slug
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "OS_SLUG=linux" >> "$GITHUB_ENV" ;;
            macOS) echo "OS_SLUG=macos" >> "$GITHUB_ENV" ;;
            Windows) echo "OS_SLUG=windows" >> "$GITHUB_ENV" ;;
            *) echo "OS_SLUG=unknown" >> "$GITHUB_ENV" ;;
          esac

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @allure-tests/shared build

      - name: Install Playwright browsers
        if: matrix.framework == 'playwright' || matrix.framework == 'codeceptjs'
        shell: bash
        run: |
          install_playwright() {
            local filter="$1"
            if [ "${{ runner.os }}" = "Linux" ]; then
              pnpm --filter "$filter" exec playwright install --with-deps chromium
            else
              pnpm --filter "$filter" exec playwright install chromium
            fi
          }

          install_playwright @allure-tests/playwright
          if [ "${{ matrix.framework }}" = "codeceptjs" ]; then
            install_playwright @allure-tests/codeceptjs
          fi

      - name: Install Cypress binary
        if: matrix.framework == 'cypress'
        run: pnpm --filter @allure-tests/cypress exec cypress install

      # WebdriverIO uses @wdio/allure-reporter which writes to disk, not allure IPC.
      # Running via `allure run` kills wdio workers before tests start (no IPC handshake).
      # We run it directly and upload the plain allure-results directory.
      - name: Run WebdriverIO tests (no IPC)
        if: matrix.framework == 'webdriverio'
        timeout-minutes: 20
        shell: bash
        env:
          ALLURE_RESULTS_DIR: allure-results-wdio
          CI: true
        run: |
          mkdir -p allure-results-wdio
          pnpm --no-bail --filter @allure-tests/webdriverio test || true

      - name: Upload WebdriverIO plain results
        if: matrix.framework == 'webdriverio'
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-wdio-${{ env.OS_SLUG }}
          path: allure-results-wdio/
          if-no-files-found: warn
          retention-days: 7

      - name: Run tests with Allure run
        if: matrix.framework != 'webdriverio'
        timeout-minutes: 20
        shell: bash
        env:
          ALLURE_STAGE: matrix
          CI: true
        run: |
          mkdir -p allure-dumps
          pnpm allure run \
            --environment=${{ env.OS_SLUG }} \
            --dump=allure-dumps/${{ matrix.framework }}-${{ env.OS_SLUG }} \
            -- pnpm --no-bail --filter @allure-tests/${{ matrix.framework }} test || true

      - name: Upload Allure dump
        if: matrix.framework != 'webdriverio'
        uses: actions/upload-artifact@v6
        with:
          name: allure-dump-${{ matrix.framework }}-${{ env.OS_SLUG }}
          path: allure-dumps/${{ matrix.framework }}-${{ env.OS_SLUG }}.zip
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Generate and publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 30
    env:
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter=allure-3-tests --ignore-scripts

      - name: Download Allure dumps
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: ./allure-dumps
          pattern: allure-dump-*
          merge-multiple: true

      - name: Download WebdriverIO plain results
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: ./allure-results-wdio
          pattern: allure-results-wdio-*
          merge-multiple: true

      - name: Verify Allure inputs
        shell: bash
        run: |
          shopt -s nullglob
          dumps=(allure-dumps/*.zip)
          wdio_results=(allure-results-wdio/*.json)
          echo "Dump archives: ${#dumps[@]}"
          echo "WebdriverIO result files: ${#wdio_results[@]}"
          if [ "${#dumps[@]}" -eq 0 ] && [ "${#wdio_results[@]}" -eq 0 ]; then
            echo "No inputs found — cannot generate a report."
            exit 1
          fi

      - name: Generate Allure 3 report
        id: generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          dump_args=()
          for f in allure-dumps/*.zip; do
            dump_args+=(--dump="$f")
          done
          extra_dirs=()
          if [ -d allure-results-wdio ] && ls allure-results-wdio/*.json &>/dev/null 2>&1; then
            extra_dirs+=(./allure-results-wdio)
          fi
          pnpm allure generate "${dump_args[@]}" "${extra_dirs[@]}" --output=./allure-report

      - name: Allure Report action
        if: always()
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          remote-href: https://todti.github.io/allure-3-tests/${{ github.head_ref || github.ref_name }}/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: steps.generate.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ${{ github.head_ref || github.ref_name }}
          keep_files: true
