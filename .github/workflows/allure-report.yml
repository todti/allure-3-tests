name: Allure Report

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (${{ matrix.framework }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        framework:
          - playwright
          - mocha
          - cucumber
          - webdriverio
          - vitest
          - jest
          - jasmine
          - cypress
          - codeceptjs
          - newman
          - bun

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        if: matrix.framework == 'bun'
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @allure-tests/shared build

      - name: Install Playwright browsers
        if: matrix.framework == 'playwright' || matrix.framework == 'codeceptjs'
        run: pnpm --filter @allure-tests/playwright exec playwright install --with-deps chromium

      - name: Install Cypress binary
        if: matrix.framework == 'cypress'
        run: pnpm --filter @allure-tests/cypress exec cypress install

      - name: Run tests
        env:
          ALLURE_RESULTS_DIR: allure-results-${{ matrix.framework }}
        run: pnpm --filter @allure-tests/${{ matrix.framework }} test

      - name: Archive Allure results
        if: always()
        run: |
          RESULTS_DIR="allure-results-${{ matrix.framework }}"
          if [ -d "packages/${{ matrix.framework }}/$RESULTS_DIR" ]; then
            cd "packages/${{ matrix.framework }}"
            zip -r "../../$RESULTS_DIR.zip" "$RESULTS_DIR"
          elif [ -d "packages/${{ matrix.framework }}/allure-results" ]; then
            cd "packages/${{ matrix.framework }}"
            zip -r "../../$RESULTS_DIR.zip" "allure-results"
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.framework }}
          path: allure-results-${{ matrix.framework }}.zip
          retention-days: 7

  report:
    name: Generate and publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all framework results
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: allure-results-*
          merge-multiple: true

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          shopt -s nullglob
          for zip in artifacts/allure-results-*.zip; do
            echo "Merging ${zip}"
            unzip -j -o "$zip" -d allure-results/
          done
          echo "Merged result files: $(ls allure-results/*-result.json 2>/dev/null | wc -l)"

      - name: Generate Allure 3 report
        run: pnpm exec allure generate ./allure-results --output=./allure-report

      - name: Allure Report action
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          remote-href: https://todti.github.io/allure-3-tests/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true

      - name: Update README report links
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          PAGES_BASE_URL: https://todti.github.io/allure-3-tests
        run: node scripts/update-readme-reports.mjs

      - name: Commit README links
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: refresh Allure report links [skip ci]"
          git push
