name: Allure Report

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write
  checks: write
  pages: write
  id-token: write

concurrency:
  group: allure-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.framework }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework:
          - playwright
          - mocha
          - cucumber
          - webdriverio
          - vitest
          - jest
          - jasmine
          - cypress
          - codeceptjs
          - newman
          - bun

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        if: matrix.framework == 'bun'
        with:
          bun-version: latest

      - name: Resolve host slug
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "OS_SLUG=linux" >> "$GITHUB_ENV" ;;
            macOS) echo "OS_SLUG=macos" >> "$GITHUB_ENV" ;;
            Windows) echo "OS_SLUG=windows" >> "$GITHUB_ENV" ;;
            *) echo "OS_SLUG=unknown" >> "$GITHUB_ENV" ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @allure-tests/shared build

      - name: Install Playwright browsers
        if: matrix.framework == 'playwright' || matrix.framework == 'codeceptjs'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            pnpm --filter @allure-tests/playwright exec playwright install --with-deps chromium
          else
            pnpm --filter @allure-tests/playwright exec playwright install chromium
          fi

      - name: Install Cypress binary
        if: matrix.framework == 'cypress'
        run: pnpm --filter @allure-tests/cypress exec cypress install

      - name: Run tests
        timeout-minutes: 15
        env:
          ALLURE_RESULTS_DIR: allure-results-${{ matrix.framework }}-${{ env.OS_SLUG }}
        run: pnpm exec allure run --config=./allurerc.mjs --environment=${{ env.OS_SLUG }} -- pnpm --filter @allure-tests/${{ matrix.framework }} test

      - name: Resolve Allure results directory
        id: results
        if: always()
        shell: bash
        run: |
          fw="${{ matrix.framework }}"
          candidates=(
            "packages/${fw}/${ALLURE_RESULTS_DIR}"
            "packages/${fw}/allure-results"
            "${ALLURE_RESULTS_DIR}"
            "allure-results"
          )

          for dir in "${candidates[@]}"; do
            if [ -d "$dir" ] && compgen -G "${dir}/*-result.json" > /dev/null; then
              echo "path=${dir}" >> "$GITHUB_OUTPUT"
              echo "Using Allure results directory: ${dir}"
              echo "Result files: $(find "$dir" -name '*-result.json' | wc -l)"
              exit 0
            fi
          done

          echo "No Allure result files found for ${fw} on ${{ runner.os }}"
          exit 1
        env:
          ALLURE_RESULTS_DIR: allure-results-${{ matrix.framework }}-${{ env.OS_SLUG }}

      - name: Upload Allure results
        if: always() && steps.results.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.framework }}-${{ env.OS_SLUG }}
          path: ${{ steps.results.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload global attachments
        if: always() && steps.results.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-global-${{ matrix.framework }}-${{ env.OS_SLUG }}
          path: packages/${{ matrix.framework }}/allure-global
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Generate and publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @allure-tests/shared build

      - name: Download all framework results
        uses: actions/download-artifact@v4
        with:
          path: ./allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Download global attachments
        uses: actions/download-artifact@v4
        with:
          path: ./global-artifacts
          pattern: allure-global-*

      - name: Restore global attachment paths
        shell: bash
        run: |
          shopt -s nullglob
          for dir in global-artifacts/allure-global-*; do
            artifact="${dir##*/allure-global-}"
            fw="${artifact%-linux}"
            fw="${fw%-macos}"
            fw="${fw%-windows}"
            mkdir -p "packages/${fw}/allure-global"
            cp -R "${dir}/." "packages/${fw}/allure-global/"
          done
          echo "Global attachment files:"
          find packages -path '*/allure-global/*' -type f | wc -l

      - name: Verify merged Allure results
        shell: bash
        run: |
          shopt -s nullglob
          files=(allure-results/*-result.json)
          echo "Merged *-result.json files: ${#files[@]}"
          ls -la allure-results/*-result.json || true
          if [ "${#files[@]}" -lt 300 ]; then
            echo "Expected at least 300 merged test results (14 specs × 11 frameworks × 3 hosts, with headroom)."
            exit 1
          fi

      - name: Validate Allure config
        run: node -e "import('./allurerc.mjs').then(() => console.log('Allure config OK'))"

      - name: Generate Allure 3 report
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec allure generate ./allure-results --output=./allure-report

      - name: Evaluate quality gates
        run: pnpm exec allure quality-gate ./allure-results || true

      - name: Allure Report action
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          remote-href: https://todti.github.io/allure-3-tests/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true
